name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Sprite Check
        run: node --test checks/sprite-check.mjs
      - name: Run Environment Check
        run: node --test checks/environment-check.mjs
      - name: Run Sky Simulation Check
        run: node --test checks/sky-check.mjs
